# Lanvex's checks: backend, frontend, browser tests, scripts, the image, and (with access to the
# lanvex-core repository) a full installation with install.sh. docs/development.md explains each.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lanvex
          POSTGRES_PASSWORD: lanvex-dev-only
          POSTGRES_DB: lanvex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lanvex" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lanvex
          POSTGRES_PASSWORD: lanvex-dev-only
          POSTGRES_DB: lanvex_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lanvex" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend

  scripts:
    name: Installer and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh scripts/*.sh deploy/entrypoint.sh
      - name: Installer writes a valid configuration in both modes
        run: |
          mkdir -p core/lanvex && touch core/lanvex/Dockerfile   # stands in for the Lanvex Core source
          ./install.sh --core --plain-http --port 8080 --yes --no-start
          test "$(stat -c %a .env)" = 600
          docker compose config -q
          rm .env
          ./install.sh --netbox https://netbox.example.net --netbox-token nbt_abcdefghijkl.abcdefghijklmnopqrstuvwxyzabcdefghijklmn \
            --behind-proxy --yes --no-start
          docker compose config -q

  image:
    name: Image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lanvex:ci .

  stack:
    name: Full installation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_CORE_ACCESS: ${{ secrets.LANVEX_CORE_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skipped without access to lanvex-core
        if: env.HAS_CORE_ACCESS != 'true'
        run: echo "::notice::Full installation not tested. Add the LANVEX_CORE_DEPLOY_KEY secret (docs/development.md)."
      - name: Lanvex Core version from core.lock
        id: lock
        if: env.HAS_CORE_ACCESS == 'true'
        run: echo "commit=$(sed -n 's/^commit=//p' core.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: env.HAS_CORE_ACCESS == 'true'
        with:
          repository: ${{ github.repository_owner }}/lanvex-core
          ref: ${{ steps.lock.outputs.commit }}
          ssh-key: ${{ secrets.LANVEX_CORE_DEPLOY_KEY }}
          persist-credentials: false
          path: core
      - name: Install with install.sh
        if: env.HAS_CORE_ACCESS == 'true'
        run: ./install.sh --core --plain-http --port 8080 --admin ci-admin --time-zone Europe/Berlin --yes | tee install.log
      - name: Check the installation
        if: env.HAS_CORE_ACCESS == 'true'
        run: |
          password=$(sed -n 's/^  Password:  //p' install.log)
          scripts/check-install.sh http://127.0.0.1:8080 ci-admin "$password"
      - name: Container logs
        if: failure() && env.HAS_CORE_ACCESS == 'true'
        run: docker compose ps -a && docker compose logs --no-color --tail 150
