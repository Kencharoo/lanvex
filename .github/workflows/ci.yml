# Lanvex's checks: backend, frontend, browser tests, scripts, the image, and a full installation with
# install.sh and the Lanvex Core version from core.lock. docs/development.md explains each.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lanvex
          POSTGRES_PASSWORD: lanvex-dev-only
          POSTGRES_DB: lanvex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lanvex" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lanvex
          POSTGRES_PASSWORD: lanvex-dev-only
          POSTGRES_DB: lanvex_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lanvex" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - name: Keep traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 14

  scripts:
    name: Installer and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh lanvexctl scripts/*.sh deploy/entrypoint.sh
      - name: lanvexctl with stand-ins for the runtime and the installer
        run: scripts/test-lanvexctl.sh
      - name: Installer writes a valid configuration in both modes
        run: |
          mkdir -p core/lanvex && touch core/lanvex/Dockerfile   # stands in for the Lanvex Core source
          ./install.sh --core --plain-http --port 8080 --yes --no-start
          test "$(stat -c %a .env)" = 600
          docker compose config -q
          rm .env
          ./install.sh --netbox https://netbox.example.net --netbox-token nbt_abcdefghijkl.abcdefghijklmnopqrstuvwxyzabcdefghijklmn \
            --behind-proxy --yes --no-start
          docker compose config -q

  image:
    name: Image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lanvex:ci .

  lab:
    name: SSH lab (real servers)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lanvex
          POSTGRES_PASSWORD: lanvex-dev-only
          POSTGRES_DB: lanvex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lanvex" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the lab (Ubuntu 24.04 with each network stack, Fedora 44 and Debian 12)
        # Normally 3 to 5 minutes; a stalled mirror download should fail the job, not use up its time.
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq debootstrap >/dev/null
          # VLAN interfaces in the lab containers need the host kernel's 802.1Q module, bonds its bonding
          # module (without the bond0 it would otherwise create).
          sudo modprobe 8021q && sudo modprobe dummy && sudo modprobe bonding max_bonds=0
          # The runners' own Ubuntu mirror: archive.ubuntu.com stalled mid-download from them.
          sudo LANVEX_LAB_ROOTFS=/tmp/lanvex-lab/rootfs LANVEX_LAB_MIRROR=http://azure.archive.ubuntu.com/ubuntu \
            LANVEX_LAB_BASE_IMAGE=docker.io/library/ubuntu:24.04 LANVEX_LAB_FEDORA=1 LANVEX_LAB_DEBIAN=1 deploy/lab/build.sh
      - name: Start the lab
        run: sudo deploy/lab/up.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - name: Lab tests (reading servers, real changes and rollbacks)
        working-directory: backend
        env:
          LANVEX_TEST_LAB: "1"
        run: uv run pytest -m lab -q -rs
      - name: Browser tests against the lab
        working-directory: frontend
        env:
          LANVEX_E2E_LAB: "1"
          PGPASSWORD: lanvex-dev-only
        run: |
          psql -h localhost -U lanvex -d lanvex_test -c "CREATE DATABASE lanvex_e2e"
          npm ci && npx playwright install --with-deps chromium
          npx playwright test e2e/servers.lab.spec.ts e2e/changes.lab.spec.ts e2e/switches.lab.spec.ts
      - name: Lab state and logs
        if: failure()
        run: |
          for c in lab-netplan lab-nm lab-ifup lab-fedora lab-debian; do
            echo "== $c"; docker exec "$c" systemctl is-system-running || true
            docker exec "$c" journalctl --no-pager -n 30 || true
          done
      - name: Keep traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-lab-results
          path: frontend/test-results
          retention-days: 14

  stack:
    name: Full installation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Lanvex Core version from core.lock
        id: lock
        run: echo "commit=$(sed -n 's/^commit=//p' core.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lanvex-core
          ref: ${{ steps.lock.outputs.commit }}
          # Only needed if lanvex-core is private: a read-only deploy key (docs/development.md).
          ssh-key: ${{ secrets.LANVEX_CORE_DEPLOY_KEY }}
          persist-credentials: false
          path: core
      - name: Install with install.sh
        # bash with pipefail: a failing installer must fail this step, not just tee.
        shell: bash
        run: ./install.sh --core --plain-http --port 8080 --admin ci-admin --time-zone Europe/Berlin --yes | tee install.log
      - name: Check the installation
        run: |
          password=$(sed -n 's/^  Password:  //p' install.log)
          scripts/check-install.sh http://127.0.0.1:8080 ci-admin "$password"
      - name: Container logs
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail 150 || echo "No containers were started."

  lanvexctl:
    name: lanvexctl (install, update, backup, restore)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          path: lanvex
      - name: Lanvex Core version from core.lock
        id: lock
        run: echo "commit=$(sed -n 's/^commit=//p' lanvex/core.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lanvex-core
          ref: ${{ steps.lock.outputs.commit }}
          ssh-key: ${{ secrets.LANVEX_CORE_DEPLOY_KEY }}
          persist-credentials: false
          path: lanvex-core
      - name: Two release archives, this commit and the same as the next version
        shell: bash
        run: |
          cd lanvex
          git config user.name ci && git config user.email ci@example.invalid
          scripts/release.sh ../lanvex-core ../dist
          sed -i 's/^__version__ = "\(.*\)"/__version__ = "\1+next"/' backend/lanvex/__init__.py
          git commit -qam "The next version"
          scripts/release.sh ../lanvex-core ../dist
          ls -l ../dist
      - name: Install with lanvexctl, as root
        shell: bash
        run: |
          first=$(ls dist/lanvex-*.zip | grep -v next)
          sudo lanvex/lanvexctl install --file "$first" -- --core --plain-http --port 8080 --admin ci-admin \
            --time-zone Europe/Berlin --yes < /dev/null | tee install.log
          test -x /usr/local/bin/lanvexctl && test -L /opt/lanvex/current
          password=$(sed -n 's/^  Password:  //p' install.log)
          lanvex/scripts/check-install.sh http://127.0.0.1:8080 ci-admin "$password"
          sudo lanvexctl status
      - name: Back up, with a second user to find again
        run: |
          id=$(sudo docker ps -q --filter label=com.docker.compose.service=lanvex)
          printf 'reader-password-1234' | sudo docker exec -i "$id" lanvex create-user ci-reader --password-stdin
          sudo lanvexctl backup /root/lanvex-backup.tar.gz
          test "$(sudo stat -c %a /root/lanvex-backup.tar.gz)" = 600
      - name: Update with lanvexctl
        shell: bash
        run: |
          sudo lanvexctl update --file dist/lanvex-*+next.zip < /dev/null
          id=$(sudo docker ps -q --filter label=com.docker.compose.service=lanvex)
          sudo docker exec "$id" python -c "import lanvex; print(lanvex.__version__)" | tee /dev/stderr | grep -q '+next$'
          sudo ls /opt/lanvex/backups | grep -q before-update
          lanvex/scripts/check-install.sh http://127.0.0.1:8080 ci-admin "$(sed -n 's/^  Password:  //p' install.log)"
      - name: Remove everything, install again, restore the backup
        shell: bash
        run: |
          sudo lanvexctl uninstall --purge --yes
          test -z "$(sudo docker volume ls -q --filter label=com.docker.compose.project=lanvex)"
          sudo lanvexctl install --file dist/lanvex-*+next.zip -- --core --plain-http --port 8080 --admin other-admin \
            --yes < /dev/null > reinstall.log
          sudo lanvexctl restore /root/lanvex-backup.tar.gz --yes
          # The administrator and the reader from before the backup sign in; the new administrator is gone.
          lanvex/scripts/check-install.sh http://127.0.0.1:8080 ci-admin "$(sed -n 's/^  Password:  //p' install.log)"
          login() { curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d "{\"username\": \"$1\", \"password\": \"$2\"}" http://127.0.0.1:8080/api/v1/auth/login; }
          test "$(login ci-reader reader-password-1234)" = 200
          test "$(login other-admin "$(sed -n 's/^  Password:  //p' reinstall.log)")" = 401
      - name: Container logs
        if: failure()
        run: |
          cd /opt/lanvex/current 2>/dev/null && sudo docker compose ps -a && sudo docker compose logs --no-color --tail 150 \
            || echo "No containers were started."

  podman:
    # The same installation under rootless Podman, set up like Fedora Server: no Docker, podman-compose,
    # and short-name-mode "enforcing" with several search registries (a short image name fails).
    name: Full installation (rootless Podman)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Lanvex Core version from core.lock
        id: lock
        run: echo "commit=$(sed -n 's/^commit=//p' core.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lanvex-core
          ref: ${{ steps.lock.outputs.commit }}
          ssh-key: ${{ secrets.LANVEX_CORE_DEPLOY_KEY }}
          persist-credentials: false
          path: core
      - name: Podman like Fedora's, and no Docker
        run: |
          sudo mkdir -p /etc/containers/registries.conf.d
          printf 'unqualified-search-registries = ["docker.io", "quay.io"]\nshort-name-mode = "enforcing"\n' \
            | sudo tee /etc/containers/registries.conf.d/99-fedora-like.conf
          pipx install podman-compose==1.6.0
          podman --version && podman-compose --version
          # Hide Docker, so the installer has to choose Podman.
          sudo systemctl stop docker.socket docker.service
          sudo mv "$(command -v docker)" /usr/local/sbin/docker.hidden
      - name: Install with install.sh (rootless)
        # bash with pipefail: a failing installer must fail this step, not just tee.
        shell: bash
        run: ./install.sh --core --plain-http --port 8080 --admin ci-admin --time-zone Europe/Berlin --yes < /dev/null | tee install.log
      - name: Check the installation
        run: |
          grep -q "^LANVEX_BOOTSTRAP_ADMIN_PASSWORD=$" .env   # removed after the first start
          password=$(sed -n 's/^  Password:  //p' install.log)
          scripts/check-install.sh http://127.0.0.1:8080 ci-admin "$password"
          for s in lanvex core core-worker; do
            id=$(podman ps -q --filter label=com.docker.compose.service=$s)
            podman healthcheck run "$id" && echo "$s: healthy"
          done
      - name: Update with install.sh --update (rootless)
        # The next release unpacked next to this one: podman-compose must replace the running containers
        # even though the compose file is the same, and the boot unit must follow to the new directory.
        shell: bash
        run: |
          mkdir ../lanvex-next && cp -a . ../lanvex-next/ && rm ../lanvex-next/.env
          sed -i 's/^__version__ = "\(.*\)"/__version__ = "\1+next"/' ../lanvex-next/backend/lanvex/__init__.py
          ../lanvex-next/install.sh --update "$PWD" < /dev/null | tee update.log
          id=$(podman ps -q --filter label=com.docker.compose.service=lanvex)
          podman exec "$id" python -c "import lanvex; print(lanvex.__version__)" | tee /dev/stderr | grep -q '+next$'
          grep -qx "WorkingDirectory=$(cd ../lanvex-next && pwd)" ~/.config/systemd/user/lanvex.service
          password=$(sed -n 's/^  Password:  //p' install.log)
          ../lanvex-next/scripts/check-install.sh http://127.0.0.1:8080 ci-admin "$password"
      - name: lanvexctl takes over an installation unpacked by hand (rootless)
        # Like a server set up before lanvexctl: Lanvex runs from ../lanvex-next, not ~/lanvex. lanvexctl,
        # run from a download, must find it by its containers, back it up, update it into
        # ~/lanvex/releases/ and install itself.
        shell: bash
        run: |
          stage=$(mktemp -d) && mkdir "$stage/lanvex-take"
          tar -C ../lanvex-next --exclude=.git --exclude=node_modules --exclude=.env -cf - . | tar -C "$stage/lanvex-take" -xf -
          sed -i 's/^__version__ = "\(.*\)"/__version__ = "\1+take"/' "$stage/lanvex-take/backend/lanvex/__init__.py"
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' "$stage/lanvex-take/backend/lanvex/__init__.py")
          (cd "$stage" && zip -qr take.zip lanvex-take)
          cp lanvexctl "$stage/lanvexctl"
          out=$(cd /tmp && bash "$stage/lanvexctl" status) && echo "$out"
          grep -q "Directory:  $(cd ../lanvex-next && pwd)" <<<"$out"
          (cd /tmp && bash "$stage/lanvexctl" update --file "$stage/take.zip" < /dev/null)
          [ "$(readlink ~/lanvex/current)" = "releases/$version" ]
          ls ~/lanvex/backups/lanvex-*-before-update-*.tar.gz
          ~/.local/bin/lanvexctl status
          grep -qx "WorkingDirectory=$HOME/lanvex/releases/$version" ~/.config/systemd/user/lanvex.service
          id=$(podman ps -q --filter label=com.docker.compose.service=lanvex)
          podman exec "$id" python -c "import lanvex; print(lanvex.__version__)" | grep -q '+take$'
          password=$(sed -n 's/^  Password:  //p' install.log)
          ~/lanvex/current/scripts/check-install.sh http://127.0.0.1:8080 ci-admin "$password"
      - name: Container logs
        if: failure()
        run: |
          podman ps -a || true
          for c in $(podman ps -aq); do podman logs --tail 80 "$c" || true; done
