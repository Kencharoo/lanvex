[project]
name = "lanvex"
version = "0.1.0"
description = "Lanvex — Network Infrastructure, Simplified. Backend API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "httpx>=0.28",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[project.scripts]
lanvex = "lanvex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lanvex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "netbox: integration tests against a real, disposable NetBox (requires LANVEX_TEST_NETBOX_URL and LANVEX_TEST_NETBOX_TOKEN)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "UP046", "E501"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["lanvex"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
